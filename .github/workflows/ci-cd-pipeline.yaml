name: CI CD Pipeline

on: 
  push: 
  
jobs:
  test: 
    name: Verifying Test Cases 
    runs-on:  ubuntu-latest

    steps:
      - name: Checkout Code 
        uses: actions/checkout@v7
       
      - name: Nodejs Setup 
        uses: actions/setup-node@v7
        with: 
          node-version: '22'

      - name: Dependencies Installation
        run: npm i

      - name: Run Test 
        run: npm run test 
