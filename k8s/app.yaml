apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-node-app
  namespace: my-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-node-app
  template:
    metadata:
      labels:
        app: my-node-app
    spec:
      containers:
      - name: my-node-app
        image: nodejs-helm-app:3.3.0
        imagePullPolicy: Never
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m" 
        ports:
        - containerPort: 3000
        envFrom:
          - configMapRef:
              name: my-node-app-config
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: my-node-app
  namespace: my-app
spec:
  type: NodePort

  selector:
    app: my-node-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000

