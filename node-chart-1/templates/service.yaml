apiVersion: v1
kind: Service
metadata:
  name:  {{ include "node-app.fullname" . }}-service
spec:
  type: {{ .Values.services.type }}
  selector:
    app: {{ include "node-app.fullname" . }}
  ports:
  - port: {{ .Values.services.containerPort }}
    targetPort: {{ .Values.services.targetPort }}
    